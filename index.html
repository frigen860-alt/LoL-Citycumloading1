<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOL City Loading</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loading-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
    </style>
</head>
<body>
    <video
        id="loading-video"
        autoplay
        loop
        playsinline
        preload="auto"
    >
        <source src="./0801.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("loading-video");
        video.volume = 1;

        async function startVideo() {
            video.muted = false;

            try {
                await video.play();
            } catch (error) {
                // Если браузер блокирует автозапуск со звуком,
                // запускаем видео без звука, чтобы экран не зависал.
                video.muted = true;

                try {
                    await video.play();
                } catch (_) {}
            }
        }

        async function enableSound() {
            video.muted = false;
            video.volume = 1;

            try {
                await video.play();
            } catch (_) {}
        }

        video.addEventListener("loadedmetadata", startVideo);
        video.addEventListener("canplay", startVideo);

        window.addEventListener("load", () => {
            video.load();
            startVideo();
        });

        ["click", "mousedown", "keydown", "touchstart", "wheel"].forEach(eventName => {
            window.addEventListener(eventName, enableSound, { once: true });
        });

        setInterval(() => {
            if (video.paused) {
                startVideo();
            }
        }, 1000);
    </script>
</body>
</html>
